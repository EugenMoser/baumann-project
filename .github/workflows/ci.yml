name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR runs may be cancelled by newer pushes; main runs never, so a deploy
# (migration + release) always runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (full history)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/${archive}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --no-banner -v .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

      - name: Build Docker image
        run: >
          docker build -t baumann-demo:ci
          --build-arg NEXT_PUBLIC_SITE_URL
          --build-arg NEXT_PUBLIC_SUPABASE_URL
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          .

      # next/image needs sharp at runtime; resolve it the way Next does (from
      # next's own location in the standalone pnpm layout) and encode once.
      - name: Check sharp inside the image
        run: |
          docker run --rm --entrypoint node baumann-demo:ci -e "
          const p = require.resolve('next/dist/server/image-optimizer');
          const sharp = require(require.resolve('sharp', { paths: [p] }));
          sharp({ create: { width: 2, height: 2, channels: 3, background: '#fff' } })
            .webp().toBuffer()
            .then((b) => console.log('sharp ok', sharp.versions.sharp, b.length))
            .catch((e) => { console.error(e); process.exit(1); });
          "

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:test
      - name: Generated types match the migrations
        run: pnpm db:types && git diff --exit-code -- lib/supabase/database.types.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start

      - name: Point the build at the local stack
        run: |
          status="$(pnpm exec supabase status -o json)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<<"$status")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<<"$status")" >> "$GITHUB_ENV"

      - run: pnpm build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [app, db, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Open SSH tunnel to the database
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DB_TUNNEL_TARGET: ${{ secrets.DEPLOY_DB_TUNNEL_TARGET }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
            -fN -L "54329:${DB_TUNNEL_TARGET}" "${SSH_USER}@${SSH_HOST}"

      - name: Apply migrations
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: pnpm exec supabase db push --db-url "$PROD_DB_URL"

      - name: Check that this run is the current main head
        id: head
        run: |
          head_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved to ${head_sha}; the newer run will deploy it"
          fi

      - name: Trigger Coolify deployment
        if: steps.head.outputs.current == 'true'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: >
          curl --fail-with-body -sS -X POST "$COOLIFY_WEBHOOK_URL"
          -H "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Smoke check
        if: steps.head.outputs.current == 'true'
        env:
          PREVIEW_URL: ${{ secrets.PREVIEW_URL }}
          PREVIEW_BASIC_AUTH: ${{ secrets.PREVIEW_BASIC_AUTH }}
        run: node scripts/smoke-check.mts "$PREVIEW_URL" "$GITHUB_SHA"
